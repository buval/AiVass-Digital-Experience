<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- ── Default title / meta ── (overridden per-page by useSeoMeta) -->
    <title>AiVass — Building Extraordinary Futures</title>
    <meta name="description" content="AiVass is a boutique technology-enabled transformation studio. Automation with Soul — where intelligent systems, human connection and strategic architecture come together." />
    <meta name="robots" content="index, follow" />

    <!-- ── Canonical (overridden per-page) -->
    <link rel="canonical" href="https://aivass.com/" />

    <!-- ── Sitemap reference -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ── Open Graph / social preview ── (overridden per-page by useSeoMeta) -->
    <meta property="og:url" content="https://aivass.com/" />
    <meta property="og:title" content="AiVass — Building Extraordinary Futures" />
    <meta property="og:description" content="A boutique transformation studio where intelligent systems, human connection and strategic architecture come together to build what comes next." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://aivass.com/opengraph.jpg" />
    <!-- TODO: Upload 1200×630 branded OG image to public/opengraph.jpg before launch -->

    <!-- ── Twitter / X card ── (overridden per-page) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AiVass — Building Extraordinary Futures" />
    <meta name="twitter:description" content="A boutique transformation studio where intelligent systems, human connection and strategic architecture come together to build what comes next." />
    <meta name="twitter:image" content="https://aivass.com/opengraph.jpg" />

    <!-- ── Favicon (Google Search requires a crawlable icon ≥48×48) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0D1B2A" />

    <!-- ── Fonts (Google Fonts — transmits IP on load; disclosed in Privacy Policy) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap">

    <!-- ── Google Consent Mode v2 defaults ───────────────────────────────────
         MUST be placed before the gtag.js script (loaded dynamically from
         src/lib/analytics.ts once VITE_GA_MEASUREMENT_ID is configured).
         Defaults: deny analytics and advertising storage until user consents.
         AiVass does not use advertising technologies; ad_storage is always denied.
    ──────────────────────────────────────────────────────────────────────── -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        wait_for_update: 500
      });
    </script>

    <!-- ── Structured data: Organization ────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AiVass",
      "legalName": "AiVass LLC",
      "url": "https://aivass.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://aivass.com/apple-touch-icon.png"
      },
      "description": "AiVass is a boutique technology-enabled transformation studio working at the intersection of intelligent systems, strategy and human potential. Automation with Soul.",
      "sameAs": [
        "https://www.linkedin.com/company/aivass",
        "https://www.facebook.com/AiVass",
        "https://www.instagram.com/aiva.ss/",
        "https://x.com/AiVass_com",
        "https://www.youtube.com/@AiVa_ss"
      ]
    }
    </script>

    <!-- ── Structured data: WebSite ─────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AiVass",
      "url": "https://aivass.com"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
