kind = "web"
previewPath = "/"
title = "AiVass Website"
description = "The AiVass boutique transformation studio website — a premium editorial marketing site with a responsive homepage, multi-page navigation (Solutions, Guides, Insights, About, Contact), and the approved architectural cream/navy/oxblood brand system."
version = "1.0.0"
id = "artifacts/aivass-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21114

[services.development]
run = "pnpm --filter @workspace/aivass-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aivass-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/aivass-web/dist/public"

# Route clean article paths to their prerendered .html files before the SPA
# catch-all. Replit static rewrites use * wildcard substitution in both fields.
[[services.production.rewrites]]
from = "/insights/articles/*/"
to = "/insights/articles/*.html"

[[services.production.rewrites]]
from = "/insights/articles/*"
to = "/insights/articles/*.html"

# SPA catch-all: all other client-side routes fall back to the app shell.
[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21114"
BASE_PATH = "/"