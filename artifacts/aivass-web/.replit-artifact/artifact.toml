kind = "web"
previewPath = "/"
title = "AiVass Website"
description = "The AiVass boutique transformation studio website — a premium editorial marketing site with a responsive homepage, multi-page navigation (Solutions, Guides, Insights, About, Contact), and the approved architectural cream/navy/oxblood brand system."
version = "1.0.0"
id = "artifacts/aivass-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21114

[services.development]
run = "pnpm --filter @workspace/aivass-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aivass-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/aivass-web/dist/public"

# Replit artifact static rewrites do not interpolate wildcard captures. Keep an
# exact clean-path mapping for every generated article; validation fails if a
# future article is added without both forms.
[[services.production.rewrites]]
from = "/insights/articles/support-system-every-immigrant-needs/"
to = "/insights/articles/support-system-every-immigrant-needs.html"

[[services.production.rewrites]]
from = "/insights/articles/support-system-every-immigrant-needs"
to = "/insights/articles/support-system-every-immigrant-needs.html"

[[services.production.rewrites]]
from = "/insights/articles/from-surviving-to-thriving/"
to = "/insights/articles/from-surviving-to-thriving.html"

[[services.production.rewrites]]
from = "/insights/articles/from-surviving-to-thriving"
to = "/insights/articles/from-surviving-to-thriving.html"

[[services.production.rewrites]]
from = "/insights/articles/mastering-your-field-of-endeavor/"
to = "/insights/articles/mastering-your-field-of-endeavor.html"

[[services.production.rewrites]]
from = "/insights/articles/mastering-your-field-of-endeavor"
to = "/insights/articles/mastering-your-field-of-endeavor.html"

[[services.production.rewrites]]
from = "/insights/articles/eb1a-critical-role-criterion/"
to = "/insights/articles/eb1a-critical-role-criterion.html"

[[services.production.rewrites]]
from = "/insights/articles/eb1a-critical-role-criterion"
to = "/insights/articles/eb1a-critical-role-criterion.html"

# SPA catch-all: all other client-side routes fall back to the app shell.
[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21114"
BASE_PATH = "/"