kind = "web"
previewPath = "/aivass-web/"
title = "AiVass Website"
description = "The AiVass boutique transformation studio website — a premium editorial marketing site with a responsive homepage, multi-page navigation (Solutions, Guides, Insights, About, Contact), and the approved architectural cream/navy/oxblood brand system."
version = "1.0.0"
id = "artifacts/aivass-web"
router = "path"

[[services]]
name = "web"
paths = [ "/aivass-web/" ]
localPort = 21114

[services.development]
run = "pnpm --filter @workspace/aivass-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aivass-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/aivass-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21114"
BASE_PATH = "/aivass-web/"
