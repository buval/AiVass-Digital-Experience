kind = "web"
previewPath = "/"
title = "AiVass Website"
description = "The AiVass boutique transformation studio website — a premium editorial marketing site with a responsive homepage, multi-page navigation (Solutions, Guides, Insights, About, Contact), and the approved architectural cream/navy/oxblood brand system."
version = "1.0.0"
id = "artifacts/aivass-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21114

[services.development]
run = "pnpm --filter @workspace/aivass-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aivass-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/aivass-web/dist/public"

# Route article paths to their prerendered .html files (with per-article
# JSON-LD) BEFORE the SPA catch-all. Both slug/ and slug match rules are
# needed: Google's CDN issues a 301 no-slash→slash, so the slash form must
# also be handled. The .html files are written by postbuild prerender-articles.mjs.
[[services.production.rewrites]]
from = "/insights/articles/:slug/"
to = "/insights/articles/:slug.html"

[[services.production.rewrites]]
from = "/insights/articles/:slug"
to = "/insights/articles/:slug.html"

# SPA catch-all: all other client-side routes fall back to the app shell.
[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21114"
BASE_PATH = "/"
