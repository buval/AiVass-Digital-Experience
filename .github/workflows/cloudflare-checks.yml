name: Cloudflare migration checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:cloudflare
      - run: pnpm test:cloudflare
      - run: pnpm run build:cloudflare
      - run: pnpm wrangler deploy --dry-run
      - run: node cloudflare/smoke.mjs
